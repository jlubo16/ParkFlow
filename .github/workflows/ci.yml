name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

  deploy:
    name: Deploy development to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          passphrase: ${{ secrets.SSH_PASSPHRASE_DEV }}
          script: |
            set -e
            cd /root/projects/electivaVDiurno/equipo-6/parkflow-deploy
            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev
            docker compose -p parkflow --env-file /root/projects/electivaVDiurno/equipo-6/parkflow/.env -f /root/projects/electivaVDiurno/equipo-6/parkflow-deploy/docker-compose.yml up -d --build --no-deps backend
